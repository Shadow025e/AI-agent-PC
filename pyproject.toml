[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-pc"
version = "0.1.0"
description = "Local-first AI agent scaffold for desktop workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AI-agent-PC Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ai-agent-pc = "ai_agent_pc.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
